# 首次申请 SSL 前使用：仅监听 80，不引用任何证书文件（避免 nginx -t / certbot 报「证书不存在」）。
# 步骤：复制为 sites-available → nginx -t → reload → certbot --nginx -d www.quizwiz.cn
# certbot 会自动改写/增加 443 与证书路径；之后若需手工合并，可参考 nginx-server-www.quizwiz.cn.conf
#
# 将下面 root 中的 ubuntu 换成你的 SSH 用户名（与 ~/QuizWiz/teacher-admin 一致）。

server {
    listen 80;
    listen [::]:80;
    server_name www.quizwiz.cn;

    root /home/ubuntu/QuizWiz/teacher-admin/dist;
    index index.html;

    client_max_body_size 100m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
