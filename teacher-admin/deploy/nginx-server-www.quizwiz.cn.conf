# QuizWiz 教师端：HTTPS + 静态前端 + /api 与 /uploads 反代 Node
# 说明：
# - /uploads/ 必须与 /api/ 一并反代；否则题目附件、头像等 URL 在浏览器无法加载。
# - 勿对 /api 使用会剥离 query 的 rewrite；知识单元等接口依赖完整查询串。
# 使用：复制到 /etc/nginx/sites-available/quizwiz.conf ，ln -s 到 sites-enabled ，certbot 后 nginx -t && reload

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.quizwiz.cn;

    ssl_certificate     /etc/letsencrypt/live/www.quizwiz.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.quizwiz.cn/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    root /srv/quizwiz/teacher-admin/dist;
    index index.html;

    # 与 Node multer 上限、大导入一致（可按需调大）
    client_max_body_size 100m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.quizwiz.cn;
    return 301 https://$host$request_uri;
}
