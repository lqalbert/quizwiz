# 完整站点示例：HTTPS + 前端静态 + /api 反代 Node
# 上传到服务器后：复制到 /etc/nginx/sites-available/ 再 ln -s 到 sites-enabled，
# 或合并进你现有站点文件。证书路径请按 certbot 实际路径修改。

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.quizwiz.cn;

    # 若证书路径不同，用: sudo certbot certificates 查看
    ssl_certificate     /etc/letsencrypt/live/www.quizwiz.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.quizwiz.cn/privkey.pem;

    # 教师端前端构建产物（与手册中 /srv/quizwiz/teacher-admin 一致）
    root /srv/quizwiz/teacher-admin/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.quizwiz.cn;
    return 301 https://$host$request_uri;
}
